spring.application.name=sportaccess-backend

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sportaccess?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase. Example for production: classpath:firebase-service-account.json
firebase.config.path=${FIREBASE_CONFIG_PATH:}

# Stripe. Keep empty locally if no account is configured.
# stripe.api.key=sk_test_...

# CORS allowed origins, comma-separated.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:5173}

# Server
server.port=8080

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
